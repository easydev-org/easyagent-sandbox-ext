<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandboxes</title>
    <style>
      /*
       * No build step, no framework. This panel does three things — list machines, list their jobs,
       * stream one job's output — and a bundler would be more moving parts than the feature.
       *
       * The palette mirrors the host's so an embedded panel does not look like a different product.
       */
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --card: #f9fafb;
        --primary: #2563eb;
        --danger: #dc2626;
        --ok: #1a7f37;
        --term: #0d1117;
        --term-fg: #c9d1d9;
      }
      html[data-theme='dark'] {
        --bg: #0f1115;
        --fg: #e6e8eb;
        --muted: #9aa3ad;
        --border: #262b33;
        --card: #161a20;
        --primary: #60a5fa;
        --danger: #f87171;
        --ok: #4ade80;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Noto Sans CJK SC', ui-sans-serif, sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }
      #app { display: flex; height: 100%; min-height: 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { color: var(--muted); }
      .micro { font-size: 11px; }

      /* Two rails and the work area: machines, jobs, output. On a narrow panel they collapse to one
         at a time, the way the host's own pages do. */
      aside { flex: 0 0 auto; overflow: auto; border-right: 1px solid var(--border); padding: 6px; }
      aside.sandboxes { width: 200px; }
      aside.jobs { width: 220px; }
      main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        min-width: 0;
      }
      header .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      .row {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        text-align: left;
        padding: 6px 8px;
        border-radius: 6px;
      }
      .row:hover { background: var(--card); }
      .row.active { background: var(--primary); color: #fff; }
      .row.active .muted { color: #dbeafe; }
      .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .pill {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
      }
      .pill.ok { color: var(--ok); border-color: var(--ok); }
      .pill.bad { color: var(--danger); border-color: var(--danger); }
      .pill.run { color: var(--primary); border-color: var(--primary); }

      /* The output pane. A terminal is dark in both themes, because that is what a terminal looks
         like and because coloured output assumes a dark background. */
      .term {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 10px;
        background: var(--term);
        color: var(--term-fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .state { margin: auto; text-align: center; color: var(--muted); padding: 24px; }
      .state.err { color: var(--danger); }

      /* The live screen. The canvas keeps its own aspect ratio and shrinks to fit, so a 1280x720
         stream is readable in a narrow panel without being cropped. */
      .screen-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        background: var(--card);
        overflow: auto;
      }
      .screen {
        max-width: 100%;
        max-height: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #000;
        /* The canvas is sized from the decoded frame; this only stops it from overflowing. */
        object-fit: contain;
      }
      .screen-state { flex: 0 0 auto; }

      /* The Screen / Output switch. Two states, both visible, so the current one is obvious rather
         than a button whose label flips. */
      .tabs {
        display: flex;
        gap: 2px;
        flex: 0 0 auto;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .tab {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        color: var(--muted);
      }
      .tab.on {
        background: var(--primary);
        color: #fff;
      }

      @media (max-width: 720px) {
        aside.sandboxes { width: 100%; border-right: 0; }
        aside.jobs { width: 100%; border-right: 0; }
        aside.sandboxes.hidden, aside.jobs.hidden, main.hidden { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
