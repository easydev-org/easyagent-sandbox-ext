id: sandbox
version: 1.0
lifecycle: [deleted]

# sandbox-ext: the sandbox + GUI-automation extension for easyagent. It is the
# Go rebrand of the worker-extension: it drives easyworker sandboxes (the
# worker.v1 Connect contract) for shell/file/job operations and, where the
# accessibility CLI is present, native GUI automation.
tools:
  - name: list-sandboxes
    description: >-
      List every configured sandbox with its OS and whether the accessibility CLI (a11y) is present.
    descriptions:
      zh: >-
        列出所有已配置的沙箱，及其 OS 与是否具备无障碍 CLI（a11y）。
    input_schema:
      type: object
      properties:
        {}
      required: []
    required_config: [sandboxes]
  - name: sandbox-info
    description: >-
      Show the connected easyworker's environment: OS/arch, workspace root, home dir, boot id —
      AND THE LANGUAGES IT CAN RUN, which is exactly what sandbox-job-start's `lang` accepts.
      That list is not "what is installed" but "what works": the engine probes each interpreter by
      RUNNING a program in it, so a binary that exists and cannot execute is never listed. Read it
      before choosing a `lang`; do not assume one.
    descriptions:
      zh: >-
        查看所连 easyworker 的环境：OS/架构、工作区根、主目录、boot id——
        **以及它能运行哪些语言**，正是 sandbox-job-start 的 `lang` 可以填的值。
        这个列表不是「装了哪些」而是「哪些能跑」：引擎会用一个探针程序真实运行每个解释器，
        存在但执行不了的二进制不会出现在里面。选 `lang` 之前先读它，不要凭假设。
    input_schema:
      type: object
      properties:
        {}
      required: []
    required_config: [sandboxes]
  - name: sandbox-job-start
    description: >-
      Run a command in a named language and wait up to `timeout` seconds (default 10, max 60).
      Returns the job id plus the output when it finishes. If it is still running
      at the deadline, returns the job id and the output so far — the job keeps
      running, and its output streams live; read it later with sandbox-job-output.
      `lang` IS REQUIRED: read sandbox-info for the ids this sandbox has. The tool
      does not guess, because `echo hi && ls` is bash, is a syntax error in Windows
      PowerShell 5.1, and means something else in PowerShell 7 — a guess would run
      the command in a language it was not written in and report success.
      PREFER python WHENEVER IT IS AVAILABLE. If sandbox-info lists `python`, write
      the program in Python and pass `lang: "python"`: it is the same program on
      every sandbox image, it does not depend on which shell is installed, and its
      quoting does not change between hosts. Use bash only for what genuinely needs
      a shell, use the host's own language (powershell, cmd) only when the task is
      about that platform, and fall back to `sh` when it is the only thing there.
    descriptions:
      zh: >-
        用指定语言运行一条命令，最多等待 `timeout` 秒（默认 10，最大 60）。完成时返回任务 id 与输出；
        到超时仍在运行则返回任务 id 与已有输出——任务继续运行，输出会实时流式显示，
        之后可用 sandbox-job-output 读取。
        `lang` 必填：可用 id 见 sandbox-info。工具不猜——`echo hi && ls` 是 bash，
        在 Windows PowerShell 5.1 里是语法错误，在 PowerShell 7 里又是别的意思；
        猜一个语言会用命令没被写成的语言执行，然后报成功。
        **只要 sandbox-info 里列了 `python`，就优先用 Python**：同一个程序在任何沙箱镜像上都一样，
        不依赖装了哪个 shell，引号规则也不会随宿主变化。只有确实需要 shell 时才用 bash，
        只有在任务本身就是那个平台时才用宿主语言（powershell、cmd），
        环境里只剩 `sh` 时才退回 `sh`。
    input_schema:
      type: object
      properties:
        lang:
          type: string
          description: "Language the command is written in (bash, python, node, ...). Read sandbox-info for the ids."
          descriptions:
            zh: "命令所用的语言（bash、python、node 等）。可用 id 见 sandbox-info。"
        mode:
          type: string
          description: "Named mode for that language (node: cjs/esm, bash: posix). Empty = the interpreter default. A mode the language does not declare is an error."
          descriptions:
            zh: "该语言的具名模式（如 node: cjs/esm、bash: posix）。留空表示解释器默认。传了该语言未声明的模式会报错。"
        command:
          type: string
          description: "The program text, written in `lang`."
          descriptions:
            zh: "程序正文，用 `lang` 指定的语言书写。"
        workdir:
          type: string
          description: "Working dir, relative to the workspace root."
          descriptions:
            zh: "工作目录，相对于工作区根。"
        timeout:
          type: integer
          description: "Seconds to wait before returning the job id (default 10, max 60)."
          descriptions:
            zh: "等待秒数，超过则先返回任务 id（默认 10，最大 60）。"
        follow:
          type: boolean
          description: "Stream the output live while it runs (default true)."
          descriptions:
            zh: "是否实时流式输出（默认 true）。"
      required: [lang, command]
    required_config: [sandboxes]
    requires: [exec]
  - name: sandbox-job-output
    description: >-
      Read a window of a job's output lines. Paged by LINE (offset/limit), and
      filterable by stream (stdout, stderr, all).
    descriptions:
      zh: >-
        读取任务输出行的某个窗口。按「行」分页（offset/limit），可按流筛选（stdout、stderr、all）。
    input_schema:
      type: object
      properties:
        job-id:
          type: string
          description: "The job id."
          descriptions:
            zh: "任务 id。"
        offset:
          type: integer
          description: "Start line (negative counts from the end)."
          descriptions:
            zh: "起始行（负数从末尾计）。"
        limit:
          type: integer
          description: "Max lines (default 200, max 1000)."
          descriptions:
            zh: "最大行数（默认 200，最大 1000）。"
        stream:
          type: string
          description: "all | stdout | stderr."
          descriptions:
            zh: "all | stdout | stderr。"
      required: [job-id]
    required_config: [sandboxes]
  - name: sandbox-job-wait
    description: >-
      Wait up to `timeout` seconds (default 60, max 90) for a job to finish; returns
      its state and the tail of its output.
    descriptions:
      zh: >-
        最多等待 `timeout` 秒（默认 60，最大 90）等待任务结束；返回状态与尾部输出。
    input_schema:
      type: object
      properties:
        job-id:
          type: string
          description: "The job id."
          descriptions:
            zh: "任务 id。"
        timeout:
          type: integer
          description: "Seconds to wait (default 60, max 90)."
          descriptions:
            zh: "等待秒数（默认 60，最大 90）。"
        intermediate:
          type: boolean
          description: >-
            Append the intermediate pipeline streams (default true).
          descriptions:
            zh: 附带管道的中间流（默认 true）。
      required: [job-id]
    required_config: [sandboxes]
  - name: sandbox-job-kill
    description: >-
      Kill a job's whole process tree.
    descriptions:
      zh: >-
        终止任务及其整个进程树。
    input_schema:
      type: object
      properties:
        job-id:
          type: string
          description: "The job id."
          descriptions:
            zh: "任务 id。"
      required: [job-id]
    required_config: [sandboxes]
    requires: [exec]
  - name: sandbox-job-list
    description: >-
      List recent jobs (id/state/exit/command).
    descriptions:
      zh: >-
        列出最近的任务（id/状态/退出码/命令）。
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: "Max jobs (default 50)."
          descriptions:
            zh: "最大任务数（默认 50）。"
      required: []
    required_config: [sandboxes]
  - name: sandbox-job-stdin
    description: >-
      Write to a running job's stdin, optionally closing it. Needed for any
      interactive command (`read`, a REPL, a prompt) — otherwise it can only be
      started and then time out.
    descriptions:
      zh: >-
        向运行中任务的标准输入写入，可选择关闭。交互式命令（`read`、REPL、提示符）必需——
        否则只能启动然后超时。
    input_schema:
      type: object
      properties:
        job-id:
          type: string
          description: "The job id."
          descriptions:
            zh: "任务 id。"
        data:
          type: string
          description: "Text to write."
          descriptions:
            zh: "要写入的文本。"
        close:
          type: boolean
          description: "Close stdin after writing (signals EOF)."
          descriptions:
            zh: "写完后关闭标准输入（表示 EOF）。"
      required: [job-id]
    required_config: [sandboxes]
    namespace: jobs
  - name: sandbox-file-read
    description: >-
      Read a text file (line-numbered). Binary files are rejected.
    descriptions:
      zh: >-
        读取文本文件（带行号）。二进制文件会被拒绝。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: "File path (relative to the workspace)."
          descriptions:
            zh: "文件路径（相对于工作区）。"
        offset:
          type: integer
          description: "Start line."
          descriptions:
            zh: "起始行。"
        limit:
          type: integer
          description: "Max lines."
          descriptions:
            zh: "最大行数。"
      required: [path]
    required_config: [sandboxes]
    requires: [file.write]
  - name: sandbox-file-list
    description: >-
      List a directory tree (breadth-first, up to `depth` levels).
    descriptions:
      zh: >-
        列出目录树（广度优先，最多 `depth` 层）。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: "Directory path (default the workspace root)."
          descriptions:
            zh: "目录路径（默认工作区根）。"
        depth:
          type: integer
          description: "Levels to expand (default 3)."
          descriptions:
            zh: "展开层数（默认 3）。"
        limit:
          type: integer
          description: "Max entries (default 200)."
          descriptions:
            zh: "最大条目数（默认 200）。"
      required: []
    required_config: [sandboxes]
  - name: sandbox-file-patch
    description: >-
      Create, edit and delete files from ONE patch document. This is the only tool that
      writes: it replaces the separate write, delete, move and copy tools, which did the
      same thing four ways and gave a caller four chances to pick the wrong one.
      A patch says what the change IS. "replace these lines" is reviewable in the tool
      call; resending a 400-line file is not, and a reviewer cannot see what changed.
      NOTHING IS WRITTEN UNTIL EVERY OPERATION HAS BEEN PROVEN. The whole patch is
      resolved against the files as they are and only then applied, so a rejected
      patch — one bad hunk, one missing anchor — leaves the workspace exactly as it was.
      THE GRAMMAR, the same one gitdev-ext uses:
        *** Begin Patch
        *** Add File: notes/todo.md
        +first line
        *** Update File: app.py
        @@ def main():
             unchanged context
        -    old line
        +    new line
        *** Delete File: scratch.txt
        *** End Patch
      A MOVE IS A Delete File plus an Add File of the same content in one patch —
      spelling out what actually happens, rather than a Move that cannot overwrite.
      An Add over an existing file is REFUSED (use Update); an Update whose context
      matches twice is REFUSED (add surrounding lines to disambiguate).
    descriptions:
      zh: >-
        用**一份 patch 文档**创建、修改、删除文件。这是唯一会写文件的工具：它取代了原来的
        write、delete、move、copy 四个工具——同一件事四种做法，调用方有四次选错的机会。
        patch 直接说明「改动是什么」：「替换这几行」在工具调用里可审阅；重发一个 400 行的文件不可审阅，
        审阅者也看不出改了什么。
        **全部校验通过之前不写任何东西**：整份 patch 先针对当前文件解析成功，然后才落地；
        所以被拒的 patch（一个坏 hunk、一个找不到的锚点）会让工作区保持原样。
        **语法与 gitdev-ext 相同**：
          *** Begin Patch
          *** Add File: notes/todo.md
          +第一行
          *** Update File: app.py
          @@ def main():
              未改动的上下文
          -    旧行
          +    新行
          *** Delete File: scratch.txt
          *** End Patch
        **移动 = 同一份 patch 里 Delete File + Add File**，把实际发生的事写清楚，
        而不是一个无法覆盖目标的 Move。
        Add 一个已存在的文件会被**拒绝**（应当用 Update）；Update 的上下文命中两处也会被**拒绝**
        （补上更多上下文以消除歧义）。
    input_schema:
      type: object
      properties:
        patch:
          type: string
          description: "The *** Begin Patch ... *** End Patch document. Operations: Add File, Update File (with @@ hunks), Delete File."
          descriptions:
            zh: "*** Begin Patch … *** End Patch 文档。操作有：Add File、Update File（配 @@ hunk）、Delete File。"
      required: [patch]
    required_config: [sandboxes]
    requires: [file.write]
  - name: sandbox-download
    description: >-
      Download a sandbox file into the agent file store, returning a file:<code>.
    descriptions:
      zh: >-
        将沙箱文件下载到 agent 文件存储，返回 file:<code>。
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: "Sandbox file path."
          descriptions:
            zh: "沙箱文件路径。"
      required: [path]
    required_config: [sandboxes]
  - name: sandbox-upload
    description: >-
      Upload an agent file:<code> into a sandbox path.
    descriptions:
      zh: >-
        将 agent 的 file:<code> 上传到沙箱路径。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file:<code>."
          descriptions:
            zh: "file:<code>。"
        path:
          type: string
          description: "Destination sandbox path."
          descriptions:
            zh: "目标沙箱路径。"
      required: [code, path]
    required_config: [sandboxes]
    requires: [file.write]
  - name: computer-info
    description: >-
      Report the GUI platform/driver and available tools of a sandbox.
    descriptions:
      zh: >-
        报告沙箱的 GUI 平台/驱动及可用工具。
    input_schema:
      type: object
      properties:
        {}
      required: []
    required_config: [sandboxes]
  - name: computer-apps
    description: >-
      List the running GUI applications (focused marked).
    descriptions:
      zh: >-
        列出正在运行的 GUI 应用（标记聚焦项）。
    input_schema:
      type: object
      properties:
        {}
      required: []
    required_config: [sandboxes]
  - name: computer-snapshot
    description: >-
      Dump the accessibility tree (already formatted for a model).
    descriptions:
      zh: >-
        导出无障碍树（已为模型格式化）。
    input_schema:
      type: object
      properties:
        app:
          type: string
          description: "App name (default the focused app)."
          descriptions:
            zh: "应用名（默认聚焦应用）。"
        depth:
          type: integer
          description: "0 = unlimited."
          descriptions:
            zh: "0 表示不限。"
      required: []
    required_config: [sandboxes]
  - name: computer-find
    description: >-
      Match elements by an accessibility selector.
    descriptions:
      zh: >-
        按无障碍选择器匹配元素。
    input_schema:
      type: object
      properties:
        selector:
          type: string
          description: "CSS-like a11y selector."
          descriptions:
            zh: "类 CSS 的 a11y 选择器。"
        app:
          type: string
          description: "App name."
          descriptions:
            zh: "应用名。"
        output:
          type: string
          description: "pretty | bounds | center."
          descriptions:
            zh: "pretty | bounds | center。"
      required: [selector]
    required_config: [sandboxes]
  - name: computer-action
    description: >-
      Perform an accessibility action on a target ref/selector.
    descriptions:
      zh: >-
        对目标 ref/选择器执行无障碍操作。
    input_schema:
      type: object
      properties:
        action:
          type: string
          description: "press | focus | set-value | type-text | toggle | select | ..."
          descriptions:
            zh: "press | focus | set-value | type-text | toggle | select | ..."
        target:
          type: string
          description: "Element ref or selector."
          descriptions:
            zh: "元素 ref 或选择器。"
        value:
          type: string
          description: "Action value (set-value/type-text)."
          descriptions:
            zh: "操作值（set-value/type-text）。"
      required: [action, target]
    required_config: [sandboxes]
  - name: computer-click
    description: >-
      Click at screen coordinates.
    descriptions:
      zh: >-
        在屏幕坐标处点击。
    input_schema:
      type: object
      properties:
        x:
          type: integer
          description: "X."
          descriptions:
            zh: "X。"
        y:
          type: integer
          description: "Y."
          descriptions:
            zh: "Y。"
        button:
          type: string
          description: "left | middle | right."
          descriptions:
            zh: "left | middle | right。"
        count:
          type: integer
          description: "Clicks (default 1)."
          descriptions:
            zh: "点击次数（默认 1）。"
      required: [x, y]
    required_config: [sandboxes]
  - name: computer-type
    description: >-
      Type text (optionally focusing a target first).
    descriptions:
      zh: >-
        输入文本（可先聚焦目标）。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: "Text to type."
          descriptions:
            zh: "要输入的文本。"
        target:
          type: string
          description: "Optional ref to focus first."
          descriptions:
            zh: "可选：先聚焦的 ref。"
      required: [text]
    required_config: [sandboxes]
  - name: computer-key
    description: >-
      Press a key (with optional modifiers held).
    descriptions:
      zh: >-
        按键（可选按住修饰键）。
    input_schema:
      type: object
      properties:
        key:
          type: string
          description: "Key name."
          descriptions:
            zh: "键名。"
        held:
          type: array
          description: "Modifiers held during the key."
          descriptions:
            zh: "按键期间按住的修饰键。"
      required: [key]
    required_config: [sandboxes]
  - name: computer-scroll
    description: >-
      Scroll at a position.
    descriptions:
      zh: >-
        在某位置滚动。
    input_schema:
      type: object
      properties:
        x:
          type: integer
          description: "X."
          descriptions:
            zh: "X。"
        y:
          type: integer
          description: "Y."
          descriptions:
            zh: "Y。"
        dx:
          type: integer
          description: "Horizontal delta."
          descriptions:
            zh: "水平增量。"
        dy:
          type: integer
          description: "Vertical delta."
          descriptions:
            zh: "垂直增量。"
      required: []
    required_config: [sandboxes]
  - name: computer-drag
    description: >-
      Drag from one position to another.
    descriptions:
      zh: >-
        从一个位置拖拽到另一个。
    input_schema:
      type: object
      properties:
        from_x:
          type: integer
          description: "Start X."
          descriptions:
            zh: "起点 X。"
        from_y:
          type: integer
          description: "Start Y."
          descriptions:
            zh: "起点 Y。"
        to_x:
          type: integer
          description: "End X."
          descriptions:
            zh: "终点 X。"
        to_y:
          type: integer
          description: "End Y."
          descriptions:
            zh: "终点 Y。"
        duration_ms:
          type: integer
          description: "Duration ms."
          descriptions:
            zh: "持续毫秒。"
      required: [from_x, from_y, to_x, to_y]
    required_config: [sandboxes]
  - name: computer-screenshot
    description: >-
      Capture the screen and return a PNG.
    descriptions:
      zh: >-
        截取屏幕并返回 PNG。
    input_schema:
      type: object
      properties:
        region:
          type: string
          description: "Optional \"x,y,w,h\"."
          descriptions:
            zh: "可选 \"x,y,w,h\"。"
      required: []
    required_config: [sandboxes]

# ── permissions ─────────────────────────────────────────────────────────────
#
# What a caller must hold to CHANGE a sandbox. Reads are deliberately ungated: a session
# that may not run commands should still be able to list jobs and read files, and gating
# reads would make every grant also a grant of visibility.
#
# A permission is a (key, params) pair. Here the param is the SANDBOX NAME, not a repository:
# "run commands in `local`" and "run commands in `build`" are different authorisations. The
# mechanism is the same one gitea-ext uses; only what the params mean differs, and that
# meaning lives entirely in this extension.
permissions:
  - key: exec
    # The label names the consequence, not the mechanism: "run commands" reads routine, while
    # what it grants is control of everything inside that sandbox.
    label: Run commands (full control of the sandbox)
    descriptions:
      zh: 在沙箱中执行命令（等同于该沙箱的完全控制权）
    # destructive, and the BROADEST grant this extension offers.
    #
    # It was labelled `write`, which understated it: a session that can run a command can also
    # rewrite any file (`echo x > /w/f`), read credentials out of the environment, and reach
    # the network from inside the sandbox. That makes it a superset of file.write, so marking
    # file.write as the more dangerous of the two was backwards.
    risk: destructive
    params:
      - name: sandbox
        type: string
        required: true
        description: >-
          Sandbox name as configured, or a wildcard such as * to allow all of them.
        descriptions:
          zh: 配置中的沙箱名，或用通配符 * 允许全部。

  - key: file.write
    label: Write, move or delete files in a sandbox
    descriptions:
      zh: 在沙箱中写入、移动或删除文件
    # write, not destructive: it is a NARROWER grant than exec, and labelling it higher made
    # the two read backwards. Its value is the case it enables — a session that may change
    # files but must not run code.
    #
    # Note that exec COVERS this: a command can write a file. file.write is the finer control
    # for a session not trusted with a shell, not a boundary against one.
    risk: write
    params:
      - name: sandbox
        type: string
        required: true
        description: >-
          Sandbox name as configured, or a wildcard such as * to allow all of them.
        descriptions:
          zh: 配置中的沙箱名，或用通配符 * 允许全部。

config:
  - name: sandboxes
    # A real FORM, not a JSON blob.
    #
    # This used to be `type: string` with a description telling the user to type
    # a JSON array by hand. That is the config every tool here depends on — it is
    # `required_config` on all of them — so a typo meant every tool in the
    # extension refused to run, with an error that named no field. Declaring the
    # shape lets the console render a list editor with per-item validation
    # (name / url / token / os) instead.
    type: list
    item_type: object
    min_items: 1
    kind: secret
    scope: global
    description: >-
      JSON list of easyworker sandboxes this extension may run against, each
      {"name":"...","url":"http://worker:80","token":"..."}. A tool's `sandbox`
      argument selects one by name; the first is the default when omitted. This
      value is a SECRET: it is never returned to a client.
    descriptions:
      zh: >-
        本扩展可运行的 easyworker 沙箱列表（JSON），每项
        {"name":"...","url":"http://worker:80","token":"..."}。工具的 `sandbox` 参数按名选择；
        省略时默认第一个。该值为机密：永不返回给客户端。
    fields:
      - name: name
        type: string
        required: true
        description: Sandbox name, used to select it from the sandbox / computer tools.
        descriptions:
          zh: 沙箱名称，sandbox / computer 工具用它来选择。
      - name: url
        type: string
        format: uri
        required: true
        description: Worker HTTP base URL (e.g. http://worker.dev.svc.cluster.local:80).
        descriptions:
          zh: worker 的 HTTP 基础地址（如 http://worker.dev.svc.cluster.local:80）。
      - name: token
        type: string
        kind: secret
        required: true
        description: Worker access token. Masked in the console; never returned.
        descriptions:
          zh: worker 访问令牌。控制台中以掩码显示，永不回传。
      - name: os
        type: enum
        enum_values: [linux, windows, macos, android]
        default: linux
        description: Sandbox OS, for tooling that differs per platform.
        descriptions:
          zh: 沙箱操作系统，供按平台区分的工具使用。
