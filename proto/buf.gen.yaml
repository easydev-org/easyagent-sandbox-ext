version: v2
# The worker contract, generated into this module's own package path.
#
# THE PROTO IS COPIED FROM easyworker, not shared by import: the two are separate Go modules that
# speak the same wire protocol, and each generates the code under its own `go_package`. What keeps them
# honest is that the .proto files are identical apart from that one option — see the note in
# worker/v1/worker.proto.
plugins:
  - local: protoc-gen-go
    out: ../gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../gen
    opt: paths=source_relative
