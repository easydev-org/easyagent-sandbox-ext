name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: lint yaml (duplicate keys)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          class Strict(yaml.SafeLoader): pass
          def no_dup(loader, node, deep=False):
              seen = set()
              for k, _ in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      raise ValueError(f"duplicate key {key!r} at line {k.start_mark.line+1}")
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dup)
          bad = 0
          for f in ("manifest.yaml",):
              try:
                  yaml.load(open(f), Loader=Strict); print("OK  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad = 1
          sys.exit(bad)
          PY

  # The sandbox tools drive a real easyworker. Starting one here would mean
  # publishing its image first, so the E2E runs only when a worker is made
  # available to CI — the unit suite covers the request/response shaping.
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ vars.SANDBOX_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -run 'E2E|Integration' -v -timeout 600s

  # The extension against a REAL broker and a REAL easyworker sandbox.
  #
  # The agent is NOT part of this: a tool call is a request on
  # `easybus.<tenant>.tool.call.<extId>.<tool>`, so the test plays the agent's part with the SDK's
  # own client. That keeps the suite about THIS extension.
  #
  # The sandbox is a real published image (easysandbox's labwc/Wayland flavour), long-lived rather
  # than created per run: these tools act on a sandbox that already exists, and only `sandbox-job-*`
  # would start one — so no Docker-in-Docker is needed.
  live:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Started detached, then probed: `up --wait` reports only "container is unhealthy" and buries
      # the reason in docker's pull output.
      - name: start nats + sandbox
        run: docker compose -f .github/ci/compose.yaml up -d

      - name: wait for services
        run: |
          set -uo pipefail
          fail=0
          for name in ci-nats ci-sandbox; do
            echo "--- waiting for $name ---"
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then echo "$name healthy after ${i}x2s"; break; fi
              if [ "$status" = "unhealthy" ]; then
                echo "::error::$name is UNHEALTHY"
                docker inspect -f '{{json .State.Health}}' "$name" || true
                docker logs "$name" 2>&1 | tail -40 || true
                fail=1; break
              fi
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)" != "healthy" ]; then
              echo "::error::$name never became healthy"
              docker inspect -f '{{json .State.Health}}' "$name" || true
              docker logs "$name" 2>&1 | tail -40 || true
              fail=1
            fi
          done
          exit $fail

      - name: live e2e (real sandbox)
        env:
          E2E_NATS_URL: nats://127.0.0.1:4222
          # The extension runs on the RUNNER, so it reaches the worker on the published host port.
          E2E_SANDBOX_URL: http://127.0.0.1:48080
        run: go test ./interop/e2e/ -v -count=1 -timeout 600s

      - name: dump service logs on failure
        if: failure()
        run: docker compose -f .github/ci/compose.yaml logs --no-color

      - name: down
        if: always()
        run: docker compose -f .github/ci/compose.yaml down -v
